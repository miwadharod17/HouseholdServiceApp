<!DOCTYPE html>
<html>
<head>
    <title>Customer Profile</title>
</head>
<body>
    <div style="text-align:center">
        <a href="{{ url_for('customer_dashboard', customer_id=customer_id) }}">HOME</a>
        <a href="{{ url_for('customer_search', customer_id=customer_id) }}">SEARCH</a>
        <a href="{{ url_for('customer_summary', customer_id=customer_id) }}">SUMMARY</a>
        <a href="{{ url_for('customer_profile', customer_id=customer_id)}}">PROFILE</a>
        <a href="{{ url_for('customer_logout') }}">LOGOUT</a>
    </div>
    <h1>Customer Profile</h1>
    <div class="profile-container">
        <p><strong>Customer ID:</strong> {{ customer.customer_id }}</p>
        <p><strong>Name:</strong> {{ customer.customer_name }}</p>
        <p><strong>Phone:</strong> {{ customer.customer_phone }}</p>
        <p><strong>Location:</strong> {{ customer.location }}</p>
    </div>
</body>
</html>
