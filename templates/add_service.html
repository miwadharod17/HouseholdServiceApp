<!DOCTYPE html>
<html>
    <head>
        <title>Add Service</title>
        
    </head>
    <body>
        <h1>Add New Service</h1>
        <form action="{{ url_for('add_service') }}" method="POST">
            <label>Service Name:</label>
            <input type="text" name="service_name" required /><br><br>
            
            <label>Description:</label>
            <input type="text" name="description"><br><br>
            
            <label>Time Required (hours):</label>
            <input type="number" name="time_required"><br><br>
            
            <label>Base Price:</label>
            <input type="number" step="0.01" name="base_price" required /><br><br>
            
            <input type="submit" value="Add Service">
        </form>
    </body>
</html>
