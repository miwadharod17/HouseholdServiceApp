<!DOCTYPE html>
<html>
    <head>
        <title>Update Service</title>
    </head>
    <body>
        <h1>Update Service</h1>
        <form action="{{ url_for('update_service', service_id=service.service_id) }}" method="POST">
            <div>
                <label>Service ID:</label>
                <input type="text" value="{{ service.service_id }}" disabled />
            </div>
            <div>
                <label>Service Name:</label>
                <input type="text" name="service_name" value="{{ service.service_name }}" required />
            </div>
            <div>
                <label>Description:</label>
                <input type="text" name="description" value="{{ service.description }}" />
            </div>
            <div>
                <label>Time Required (hours):</label>
                <input type="number" name="time_required" value="{{ service.time_required }}" />
            </div>
            <div>
                <label>Base Price:</label>
                <input type="number" step="0.01" name="base_price" value="{{ service.base_price }}" required />
            </div>
            <div>
                <input type="submit" value="Update Service">
            </div>
        </form>
        <a href="{{ url_for('admin_dashboard') }}">Cancel</a>
    </body>
</html>
