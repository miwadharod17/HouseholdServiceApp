<!DOCTYPE html>
<html>
    <head>
        <title>Customer Login</title>
    </head>
    <body>
        <div style="text-align:center">
            <a href="{{ url_for('admin_login') }}">ADMIN</a>
            <a href="{{ url_for('customer_login') }}">CUSTOMER</a>
            <a href="{{ url_for('professional_login') }}">SERVICE PROFESSIONAL</a>
        </div>
        <div style="text-align:center">
            <h1>WELCOME CUSTOMER</h1>
            <form action="{{ url_for('customer_login') }}" method="POST">
                <input type="text" name="login_id" placeholder="Login ID" required><br><br>
                <input type="text" name="password" placeholder="Password" required><br><br>
                <button type="submit">Login</button><br><br><br>
                <p>NOT REGISTERED?</p><br>
                <a href="{{ url_for('customer_register') }}">Register Now</a>
            </form>
        </div>
    </body>
</html>
